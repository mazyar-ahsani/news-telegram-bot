name: News Bot

on:
  schedule:
    - cron: '*/30 * * * *' # اجرای خودکار هر ۳۰ دقیقه
  workflow_dispatch:      # امکان اجرای دستی از تب Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # برای اجازه تغییر در ریپازیتوری
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node index.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add db.json
          # بررسی اینکه آیا تغییری در db.json ایجاد شده یا خیر
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update db.json [skip ci]" && git push)
